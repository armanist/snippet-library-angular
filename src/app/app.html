<main class="app">
  <header class="app-header">
    <h1>Snippet Library</h1>
    <p class="intro">
      Save small code snippets by language, tags, and title.
    </p>
  </header>

  <section class="workspace">
    <section class="panel">
      <h2>Add Snippet</h2>

      <app-snippet-form
        (submitted)="handleSnippetSubmitted($event)"
        (validationError)="handleValidationError($event)"
      ></app-snippet-form>
    </section>

    <section class="panel">
      <h2>Your Snippets</h2>

      <label class="snippet-search">
        Search
        <input
          type="search"
          name="search"
          [ngModel]="searchTerm"
          (ngModelChange)="handleSearchChange($event)"
          placeholder="Search snippets..."
        />
      </label>

      @if (isLoading()) {
        <p>Loading snippets...</p>
      } @else {
        <app-snippet-list
          [snippets]="snippets()"
          (deleteRequested)="handleSnippetDelete($event)"
        ></app-snippet-list>
      }

       @if (pagination(); as pageInfo) {
          <app-pagination
            [pagination]="pageInfo"
            [disabled]="isLoading()"
            (pageChange)="handlePageChange($event)" 
          ></app-pagination>
        }

      <app-confirm-dialog
        [visible]="deleteDialogVisible"
        [snippetTitle]="pendingDeleteTitle"
        (confirmed)="handleDeleteConfirmed()"
        (cancelled)="closeDeleteDialog()"
      ></app-confirm-dialog>
    </section>
  </section>
</main>

<app-toast
  [message]="toastMessage"
  [type]="toastType"
></app-toast>
