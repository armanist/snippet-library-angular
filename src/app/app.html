<main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-12">
  <header class="mb-8">
    <h1 class="mb-3 text-4xl font-bold leading-tight text-slate-900">Snippet Library</h1>
    <p class="max-w-xl text-lg leading-7 text-slate-600">
      Save small code snippets by language, tags, and title.
    </p>
  </header>

  <section  class="grid items-start gap-6 lg:grid-cols-[22.5rem_minmax(0,1fr)]">
    <section  class="min-w-0 min-h-[220px] rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="mb-4 text-xl font-semibold text-slate-900">
        {{ editingSnippet() ? 'Edit Snippet' : 'Add Snippet' }}
      </h2>

      <app-snippet-form
        [editingSnippet]="editingSnippet()"
        (submitted)="handleSnippetSubmitted($event)"
        (validationError)="toast.showError($event)"
        (canceled)="handleEditCanceled()"
      ></app-snippet-form>
    </section>

    <section  class="min-w-0 min-h-[220px] rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="mb-4 text-xl font-semibold text-slate-900">Your Snippets</h2>

      <app-snippet-list
        (editRequested)="editingSnippet.set($event)"
        (deleteRequested)="confirmDialog.open($event.id, $event.title)"
      ></app-snippet-list>

      <app-confirm-dialog
        [visible]="confirmDialog.visible()"
        [snippetTitle]="confirmDialog.pendingTitle()"
        (confirmed)="handleDeleteConfirmed()"
        (cancelled)="confirmDialog.close()"
      ></app-confirm-dialog>
    </section>
  </section>
</main>

<app-toast
  [message]="toast.message()"
  [type]="toast.type()"
></app-toast>
