<main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-12">
  <header class="mb-8">
    <h1 class="mb-3 text-4xl font-bold leading-tight text-slate-900">Snippet Library</h1>
    <p class="max-w-xl text-lg leading-7 text-slate-600">
      Save small code snippets by language, tags, and title.
    </p>
  </header>

  <section  class="grid items-start gap-6 lg:grid-cols-[22.5rem_minmax(0,1fr)]">
    <section  class="min-w-0 min-h-[220px] rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="mb-4 text-xl font-semibold text-slate-900">Add Snippet</h2>

      <app-snippet-form
        (submitted)="handleSnippetSubmitted($event)"
        (validationError)="handleValidationError($event)"
      ></app-snippet-form>
    </section>

    <section  class="min-w-0 min-h-[220px] rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
      <h2 class="mb-4 text-xl font-semibold text-slate-900">Your Snippets</h2>

      <label class="mb-4 grid gap-1.5 text-sm font-semibold text-slate-700">
        Search
        <input
          class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
          type="search"
          name="search"
          [ngModel]="searchTerm"
          (ngModelChange)="handleSearchChange($event)"
          placeholder="Search snippets..."
        />
      </label>

      @if (isLoading()) {
        <p class="text-sm text-slate-500">Loading snippets...</p>
      } @else {
        <app-snippet-list
          [snippets]="snippets()"
          (deleteRequested)="handleSnippetDelete($event)"
        ></app-snippet-list>
      }

       @if (pagination(); as pageInfo) {
          <app-pagination
             class="mt-5 block"
            [pagination]="pageInfo"
            [disabled]="isLoading()"
            (pageChange)="handlePageChange($event)" 
          ></app-pagination>
        }

      <app-confirm-dialog
        [visible]="deleteDialogVisible"
        [snippetTitle]="pendingDeleteTitle"
        (confirmed)="handleDeleteConfirmed()"
        (cancelled)="closeDeleteDialog()"
      ></app-confirm-dialog>
    </section>
  </section>
</main>

<app-toast
  [message]="toastMessage"
  [type]="toastType"
></app-toast>
