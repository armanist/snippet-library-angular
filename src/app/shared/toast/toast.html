@if(message) {
    <div
        class="fixed bottom-4 right-4 z-50 w-[calc(100%-2rem)] max-w-sm rounded-md px-4 py-3 text-sm font-semibold text-white shadow-lg"
        [class.bg-emerald-700]="type === 'success'"
        [class.bg-red-700]="type === 'error'"
        >
        {{ message }}
    </div>
}
