  @if (visible) {
    <div class="dialog-backdrop">
      <section
        class="delete-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="delete-dialog-title"
      >
        <h2 id="delete-dialog-title">Delete snippet?</h2>

        <p>
          Are you sure you want to delete
          <strong>{{ snippetTitle }}</strong>?
        </p>

        <div class="delete-dialog__actions">
          <button type="button" (click)="cancelDelete()">
            Cancel
          </button>

          <button
            type="button"
            class="delete-dialog__confirm"
            (click)="confirmDelete()"
          >
            Delete
          </button>
        </div>
      </section>
    </div>
  }
