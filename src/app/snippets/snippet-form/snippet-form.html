
  <form class="grid gap-4" #snippetForm="ngForm" (ngSubmit)="handleSubmit(snippetForm)">
    <label class="grid gap-1.5 text-sm font-semibold text-slate-700">
      Title
      <input
        class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
        ngModel
        type="text"
        name="title"
        required
        placeholder="PHP foreach loop"
      />
    </label>

    <label class="grid gap-1.5 text-sm font-semibold text-slate-700">
      Language
      <select
        class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
        name="language" [(ngModel)]="selectedLanguage">
        @for (language of languages; track language) {
            <option [value]="language">{{ language.toUpperCase() }}</option>
        }
      </select>
    </label>

    <label class="grid gap-1.5 text-sm font-semibold text-slate-700">
      Code
      <textarea
        class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
        ngModel
        name="code"
        required
        rows="8"
        placeholder="Paste your code here"
      ></textarea>
    </label>

    <label class="grid gap-1.5 text-sm font-semibold text-slate-700">
      Tags
      <input
        class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100"
        ngModel
        type="text"
        name="tags"
        placeholder="loop, array, php"
      />
    </label>

    <button  class="w-full rounded-md bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2" type="submit">
      Add Snippet
    </button>
  </form>
